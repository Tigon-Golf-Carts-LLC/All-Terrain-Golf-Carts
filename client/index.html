    <!--
      Loaded without blocking the first paint: the stylesheet is fetched as a
      low-priority resource and promoted to a stylesheet once it arrives. The
      body already has a system-font fallback stack, and `display=swap` means
      text is painted immediately and re-rendered when the webfont lands, so a
      slow or unreachable fonts host cannot hold up First Contentful Paint.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..900&family=Inter:opsz,wght@14..32,400..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
